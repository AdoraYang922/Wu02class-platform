<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五年級班級平台</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #F0F4F8;
            color: #333333;
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-size: 20px;
        }
        .top-bar {
            background-color: #1976D2;
            color: #ffffff;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .digital-clock-container {
            position: fixed; bottom: 25px; right: 35px;
            background: linear-gradient(135deg, #121212, #1e1e1e);
            border: 4px solid #00ff66; border-radius: 18px; padding: 18px 32px;
            color: #00ff66; font-family: 'Courier New', Courier, monospace; text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
            z-index: 100; display: flex; flex-direction: column; align-items: center;
        }
        .digital-clock-time { font-size: 58px; font-weight: bold; letter-spacing: 3px; text-shadow: 0 0 15px #00ff66; }
        .digital-clock-date { font-size: 22px; color: #aaeebb; margin-top: 6px; font-family: sans-serif; font-weight: bold; }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1>五年級班級平台</h1>
    </div>

    <div style="padding: 40px; font-size: 30px;">
        <h2>✨ 測試頁面：請觀察右下角的時鐘是否有正常跳動！</h2>
    </div>

    <!-- 科技時鐘 -->
    <div class="digital-clock-container" id="digital-clock-box">
        <div class="digital-clock-time" id="digital-time">--:--:--</div>
        <div class="digital-clock-date" id="digital-date">載入中...</div>
    </div>

    <script>
        // 直接在網頁載入時立刻執行時鐘
        function startLiveClock() {
            function updateClock() {
                const now = new Date();
                const year = now.getFullYear() - 1911;
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const date = String(now.getDate()).padStart(2, '0');
                let hours = now.getHours();
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                const period = hours >= 12 ? '下午' : '上午';
                hours = hours % 12 || 12;

                const timeEl = document.getElementById('digital-time');
                const dateEl = document.getElementById('digital-date');
                
                if (timeEl) {
                    timeEl.innerText = `${period} ${String(hours).padStart(2,'0')}:${minutes}:${seconds}`;
                }
                if (dateEl) {
                    dateEl.innerText = `民國${year}年${month}月${date}日`;
                }
            }
            updateClock();
            setInterval(updateClock, 1000);
        }

        // 確保 DOM 載入後直接啟動
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startLiveClock);
        } else {
            startLiveClock();
        }
    </script>
</body>
</html>
