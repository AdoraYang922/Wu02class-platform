<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">五年級班級平台</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-color: #1976D2; 
            --primary-light: #42A5F5; 
            --secondary-color: #FFC107; 
            --sidebar-bg: #0D47A1; 
            --bg-color: #F0F4F8; 
            --text-color: #333333;
            --white: #ffffff;
            --danger-color: #d32f2f;
            --warning-color: #ff9800;
            --success-color: #4caf50;
        }
        * { box-sizing: border-box; }
        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            font-size: 20px;
        }
        .top-bar {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
            gap: 20px;
            flex-wrap: wrap;
            flex-shrink: 0;
            z-index: 200;
            width: 100%;
        }
        .top-bar h1 { margin: 0; font-size: 36px; white-space: nowrap; font-weight: bold; }
        .top-center-area { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        .top-duty-badge {
            background: rgba(255, 255, 255, 0.2);
            border: 2px dashed var(--secondary-color);
            padding: 8px 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-size: 22px;
            font-weight: bold;
        }
        .top-duty-badge span { color: var(--secondary-color); font-weight: bold; font-size: 24px; }
        .btn {
            background-color: var(--primary-color); color: white;
            border: none; padding: 12px 22px; border-radius: 8px;
            cursor: pointer; transition: 0.2s; font-size: 18px; font-weight: bold;
        }
        .btn:hover { opacity: 0.9; }
        .btn-yellow { background-color: var(--secondary-color); color: #333; font-weight: bold; }
        .btn-yellow:hover { background-color: #e0a800; }
        .btn-danger { background-color: var(--danger-color); color: white; }
        
        #student-view { 
            padding: 20px 40px; 
            flex: 1; 
            width: 100%;
            overflow-y: auto; 
            display: flex;
            flex-direction: column;
        }
        .class-main-title {
            text-align: center; color: var(--primary-color); font-size: 50px; margin: 0 0 15px 0; font-weight: bold;
        }
        .digital-clock-container {
            position: fixed; bottom: 25px; right: 35px;
            background: linear-gradient(135deg, #121212, #1e1e1e);
            border: 4px solid #00ff66; border-radius: 18px; padding: 18px 32px;
            color: #00ff66; font-family: 'Courier New', Courier, monospace; text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
            z-index: 100; display: flex; flex-direction: column; align-items: center; pointer-events: none; 
        }
        .digital-clock-time { font-size: 58px; font-weight: bold; letter-spacing: 3px; }
        .digital-clock-date { font-size: 22px; color: #aaeebb; margin-top: 6px; font-weight: bold; }

        #student-personal-view, #teacher-view { display: none; flex: 1; width: 100%; overflow-y: auto; background-color: var(--bg-color); }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.55); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: var(--white); padding: 40px; border-radius: 18px; width: 90%; max-width: 600px; text-align: center; box-shadow: 0 12px 35px rgba(0,0,0,0.35);
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div><h1 id="platform-title">五年級班級平台</h1></div>
        <div class="top-center-area">
            <div class="top-duty-badge">
                <span>🌟 值日生：</span><span id="top-duty-names-display">1號 王小明</span>
            </div>
        </div>
        <div>
            <button class="btn btn-yellow" onclick="showStudentLoginModal()" id="student-login-btn">👨‍🎓 學生登入</button>
            <button class="btn btn-yellow" onclick="studentLogout()" id="student-logout-btn" style="display: none;">登出個人面板</button>
            <button class="btn btn-yellow" onclick="showLoginModal()" id="login-btn">👨‍🏫 老師登入</button>
            <button class="btn btn-yellow" onclick="logout()" id="logout-btn" style="display: none;">登出後台</button>
        </div>
    </div>

    <!-- 科技時鐘 (右下角懸浮) -->
    <div class="digital-clock-container" id="digital-clock-box">
        <div class="digital-clock-time" id="digital-time">00:00:00</div>
        <div class="digital-clock-date" id="digital-date">民國115年--月--日</div>
    </div>

    <!-- 學生端首頁 -->
    <div id="student-view">
        <h2 class="class-main-title">✨ 五乙打卡站 ✨</h2>
        <div style="text-align: center; font-size: 24px; color: #555; margin-top: 50px;">
            <p>點擊右上角「學生登入」即可進入個人面板，時鐘將會自動隱藏！</p>
        </div>
    </div>

    <!-- 學生個人面板 -->
    <div id="student-personal-view" style="padding: 40px;">
        <h2 id="personal-welcome" style="text-align: center; font-size: 40px; color: var(--sidebar-bg);"></h2>
        <div style="text-align: center; margin-top: 30px;">
            <p style="font-size: 24px;">這裡是學生的個人專屬面板（時鐘已自動隱藏）。</p>
        </div>
    </div>

    <!-- 老師後台 -->
    <div id="teacher-view" style="padding: 40px;">
        <h2 style="color: var(--primary-color);">老師管理後台</h2>
        <p style="font-size: 24px;">這裡是老師管理後台（時鐘已自動隱藏）。</p>
    </div>

    <!-- 學生登入視窗 -->
    <div class="modal-overlay" id="student-login-modal">
        <div class="modal-content">
            <h2>👨‍🎓 學生登入</h2>
            <input type="number" id="login-seat-input" placeholder="請輸入座號 (例如: 1)" style="font-size:20px; padding:10px; width:80%; margin:15px 0;"><br>
            <input type="password" id="login-password-input" placeholder="請輸入密碼 (預設為座號)" style="font-size:20px; padding:10px; width:80%; margin-bottom:20px;"><br>
            <button class="btn btn-yellow" onclick="checkStudentLogin()" style="font-size:20px; padding:10px 20px;">確認登入</button>
            <button class="btn" onclick="closeModal('student-login-modal')" style="font-size:20px; padding:10px 20px;">取消</button>
        </div>
    </div>

    <!-- 老師登入視窗 -->
    <div class="modal-overlay" id="login-modal">
        <div class="modal-content">
            <h2>老師登入</h2>
            <input type="password" id="password-input" placeholder="請輸入管理員密碼" style="font-size:20px; padding:10px; width:80%; margin:20px 0;"><br>
            <button class="btn btn-yellow" onclick="checkLogin()" style="font-size:20px; padding:10px 20px;">登入</button>
            <button class="btn" onclick="closeModal('login-modal')" style="font-size:20px; padding:10px 20px;">取消</button>
        </div>
    </div>

    <script>
        let students = [
            { id: 1, seat: 1, name: "王小明", password: "1" }
        ];

        function startLiveClock() {
            function updateClock() {
                const now = new Date();
                const year = now.getFullYear() - 1911;
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const date = String(now.getDate()).padStart(2, '0');
                let hours = now.getHours();
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                
                const timeEl = document.getElementById('digital-time');
                const dateEl = document.getElementById('digital-date');
                if (timeEl) timeEl.innerText = `${String(hours).padStart(2, '0')}:${minutes}:${seconds}`;
                if (dateEl) dateEl.innerText = `民國${year}年${month}月${date}日`;
            }
            updateClock();
            setInterval(updateClock, 1000);
        }

        function hideClockForStudent() {
            const clock = document.getElementById('digital-clock-box');
            if (clock) clock.style.display = 'none';
        }

        function showClockForHome() {
            const clock = document.getElementById('digital-clock-box');
            if (clock) clock.style.display = 'flex';
        }

        function showStudentLoginModal() {
            document.getElementById('student-login-modal').style.display = 'flex';
        }

        function showLoginModal() {
            document.getElementById('login-modal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function checkStudentLogin() {
            const seat = parseInt(document.getElementById('login-seat-input').value);
            const pass = document.getElementById('login-password-input').value.trim();
            const student = students.find(s => s.seat === seat);

            if (!student || pass !== (student.password || String(student.seat))) {
                alert("座號或密碼錯誤！預設密碼為座號。");
                return;
            }

            closeModal('student-login-modal');
            document.getElementById('student-view').style.display = 'none';
            document.getElementById('student-personal-view').style.display = 'block';
            document.getElementById('student-login-btn').style.display = 'none';
            document.getElementById('student-logout-btn').style.display = 'inline-block';
            
            document.getElementById('personal-welcome').innerText = `歡迎回來，${student.seat}號 ${student.name}同學！`;
            hideClockForStudent(); // 學生登入後隱藏時鐘
        }

        function studentLogout() {
            document.getElementById('student-personal-view').style.display = 'none';
            document.getElementById('student-view').style.display = 'flex';
            document.getElementById('student-login-btn').style.display = 'inline-block';
            document.getElementById('student-logout-btn').style.display = 'none';
            showClockForHome(); // 登出返回首頁顯示時鐘
        }

        function checkLogin() {
            const pass = document.getElementById('password-input').value;
            if (pass === "1234" || pass === "admin") {
                closeModal('login-modal');
                document.getElementById('student-view').style.display = 'none';
                document.getElementById('teacher-view').style.display = 'block';
                document.getElementById('login-btn').style.display = 'none';
                document.getElementById('logout-btn').style.display = 'inline-block';
                hideClockForStudent(); // 老師進入後台隱藏時鐘
            } else {
                alert("管理員密碼錯誤！");
            }
        }

        function logout() {
            document.getElementById('teacher-view').style.display = 'none';
            document.getElementById('student-view').style.display = 'flex';
            document.getElementById('login-btn').style.display = 'inline-block';
            document.getElementById('logout-btn').style.display = 'none';
            showClockForHome(); // 返回首頁顯示時鐘
        }

        window.onload = function() {
            startLiveClock();
            showClockForHome();
        };
    </script>
</body>
</html>
